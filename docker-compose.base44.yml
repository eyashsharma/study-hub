services:
  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:8080"
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=8080
      - BASE44_PREVIEW_MODE
    command: ["sh", "-ec", "npm install && exec node --watch index.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
